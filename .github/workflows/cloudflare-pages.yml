name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: peepul-people-planning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters. Copy the Account ID again from Cloudflare."; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: Create Pages project if needed
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/pages/projects"
          headers = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"}
          name = os.environ["PROJECT_NAME"]
          try:
              with urllib.request.urlopen(urllib.request.Request(base + "/" + name, headers=headers)) as response:
                  result = json.load(response)
                  if not result.get("success"):
                      raise RuntimeError("Cloudflare project lookup failed")
              print("Using existing Pages project")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise RuntimeError("Cloudflare project lookup failed (HTTP " + str(error.code) + ")") from None
              payload = json.dumps({"name": name, "production_branch": "main"}).encode()
              with urllib.request.urlopen(urllib.request.Request(base, data=payload, headers=headers, method="POST")) as response:
                  result = json.load(response)
                  if not result.get("success"):
                      raise RuntimeError("Cloudflare project creation failed")
              print("Created Pages project")
      - name: Deploy production
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT_NAME" --branch=main
      - name: Deployment link
        run: echo "Dashboard deployed through Cloudflare Pages." >> "$GITHUB_STEP_SUMMARY"
